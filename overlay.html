<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 75px; height: 75px;
    overflow: hidden;
    background: transparent;
    -webkit-app-region: drag;
    user-select: none;
  }
  #circle {
    width: 65px; height: 65px;
    margin: 5px;
    border-radius: 50%;
    background: rgba(56, 132, 244, 0.1);
    border: 2px dashed rgba(56, 132, 244, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    font-size: 9px;
    color: rgba(56, 132, 244, 0.5);
    text-align: center;
    transition: background 0.2s, border-color 0.2s;
    -webkit-app-region: drag;
  }
  #circle.over {
    background: rgba(56, 244, 100, 0.2);
    border-color: rgba(56, 244, 100, 0.5);
  }
</style>
</head>
<body>
<div id="circle">Drop here</div>
<script>
  const circle = document.getElementById('circle');

  // Allow external drops
  circle.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); circle.classList.add('over'); });
  circle.addEventListener('dragleave', e => { e.preventDefault(); circle.classList.remove('over'); });
  circle.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    circle.classList.remove('over');

    let text = e.dataTransfer.getData('text/uri-list')
            || e.dataTransfer.getData('text/plain')
            || '';
    text = text.trim();
    if (text) window.eazy.sendDrop(text);
  });
</script>
</body>
</html>
